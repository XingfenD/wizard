version: '3.8'

services:
  # 数据库服务
  db:
    image: mysql:8.0
    container_name: wizard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wizard
      MYSQL_USER: wizard
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker-compose/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - wizard-network

  # PHP-FPM服务
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile-php-fpm
    container_name: wizard-php-fpm
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker-compose/php-fpm/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=wizard
      - DB_USERNAME=wizard
      - DB_PASSWORD=password
    depends_on:
      - db
    networks:
      - wizard-network

  # Nginx服务
  nginx:
    image: nginx:latest
    container_name: wizard-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker-compose/nginx/sites-available:/etc/nginx/sites-available
      - ./docker-compose/nginx/sites-enabled:/etc/nginx/sites-enabled
    ports:
      - "8080:80"
    depends_on:
      - php-fpm
    networks:
      - wizard-network

  # Redis服务（可选）
  redis:
    image: redis:7.0
    container_name: wizard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wizard-network

volumes:
  mysql-data:
    driver: local

networks:
  wizard-network:
    driver: bridge